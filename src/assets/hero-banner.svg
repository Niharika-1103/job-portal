<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Hero banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf2ff"/>
      <stop offset="0.45" stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe7ff"/>
      <stop offset="1" stop-color="#c3d6ff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="screen2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blurSmall" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="420" rx="950" ry="560" fill="url(#glow)"/>

  <!-- Subtle grid for futuristic feel -->
  <g stroke="#2563eb" stroke-opacity="0.06" stroke-width="1.5">
    <path d="M0 320 H1600"/><path d="M0 420 H1600"/><path d="M0 520 H1600"/>
    <path d="M320 0 V900"/><path d="M640 0 V900"/><path d="M960 0 V900"/><path d="M1280 0 V900"/>
  </g>

  <!-- Floor -->
  <rect x="0" y="720" width="1600" height="180" fill="url(#floor)"/>
  <line x1="0" y1="720" x2="1600" y2="720" stroke="#a9c2ff" stroke-width="2"/>

  <!-- Floating orbs / particles -->
  <g filter="url(#blurSmall)">
    <circle cx="180" cy="180" r="26" fill="#bfdbfe" opacity="0.7"/>
    <circle cx="1420" cy="150" r="34" fill="#bfdbfe" opacity="0.6"/>
    <circle cx="1500" cy="620" r="20" fill="#dbeafe" opacity="0.8"/>
    <circle cx="120" cy="600" r="18" fill="#dbeafe" opacity="0.7"/>
  </g>

  <!-- ==== Developer 1 (left, sitting at desk with monitor) ==== -->
  <g transform="translate(360, 430)">
    <!-- Desk -->
    <rect x="-130" y="60" width="260" height="14" rx="4" fill="#ffffff" stroke="#dbe7ff" stroke-width="2"/>
    <rect x="-112" y="74" width="8" height="70" fill="#cbd5e1"/>
    <rect x="104" y="74" width="8" height="70" fill="#cbd5e1"/>
    <!-- Monitor -->
    <rect x="-60" y="-40" width="120" height="80" rx="6" fill="url(#screen)" stroke="#1e3a8a" stroke-width="3"/>
    <rect x="-52" y="-32" width="104" height="64" rx="3" fill="#0f172a"/>
    <!-- Code lines on monitor -->
    <g stroke="#7dd3fc" stroke-width="4" stroke-linecap="round">
      <line x1="-44" y1="-22" x2="-20" y2="-22"/>
      <line x1="-44" y1="-12" x2="-8" y2="-12"/>
      <line x1="-44" y1="-2" x2="-28" y2="-2"/>
      <line x1="-44" y1="8" x2="-16" y2="8"/>
    </g>
    <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round">
      <line x1="12" y1="-22" x2="40" y2="-22"/>
      <line x1="12" y1="-2" x2="30" y2="-2"/>
    </g>
    <g stroke="#a5b4fc" stroke-width="4" stroke-linecap="round">
      <line x1="12" y1="8" x2="44" y2="8"/>
    </g>
    <rect x="-6" y="40" width="12" height="8" rx="2" fill="#1e3a8a"/>
    <!-- Laptop base on desk -->
    <rect x="70" y="34" width="46" height="26" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="74" y="38" width="38" height="16" rx="2" fill="#0f172a"/>
    <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round">
      <line x1="80" y1="44" x2="102" y2="44"/>
      <line x1="80" y1="50" x2="94" y2="50"/>
    </g>
    <!-- Head -->
    <circle cx="-10" cy="-90" r="26" fill="#f1c27d"/>
    <g fill="#0f172a">
      <ellipse cx="-22" cy="-98" rx="10" ry="7"/>
      <ellipse cx="2" cy="-98" rx="10" ry="7"/>
    </g>
    <!-- Body -->
    <path d="M-40 -52 Q-40 -20 -26 -20 H6 Q20 -20 20 -52 Z" fill="#2563eb"/>
    <!-- Arm toward keyboard -->
    <path d="M20 -40 Q40 -30 44 -10 L30 -8 Q26 -20 14 -26 Z" fill="#1d4ed8"/>
    <path d="M-40 -40 Q-58 -30 -62 -10 L-48 -8 Q-44 -20 -32 -26 Z" fill="#1d4ed8"/>
  </g>

  <!-- ==== Developer 2 (center, standing, with laptop) ==== -->
  <g transform="translate(800, 430)">
    <!-- Small round table -->
    <ellipse cx="0" cy="60" rx="90" ry="18" fill="#ffffff" stroke="#dbe7ff" stroke-width="2"/>
    <rect x="-6" y="78" width="12" height="60" fill="#cbd5e1"/>
    <!-- Laptop on table -->
    <rect x="-40" y="30" width="80" height="32" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="-34" y="34" width="68" height="20" rx="2" fill="url(#screen2)"/>
    <g stroke="#7dd3fc" stroke-width="3" stroke-linecap="round">
      <line x1="-28" y1="40" x2="6" y2="40"/>
      <line x1="-28" y1="46" x2="-12" y2="46"/>
    </g>
    <g stroke="#a5b4fc" stroke-width="3" stroke-linecap="round">
      <line x1="10" y1="40" x2="28" y2="40"/>
    </g>
    <!-- Headview -->
    <circle cx="0" cy="-95" r="27" fill="#a56a4a"/>
    <g fill="#0f172a">
      <ellipse cx="-13" cy="-103" rx="11" ry="7"/>
      <ellipse cx="13" cy="-103" rx="11" ry="7"/>
    </g>
    <!-- Body -->
    <path d="M-42 -55 Q-42 -20 -26 -20 H26 Q42 -20 42 -55 Z" fill="#1e40af"/>
    <!-- Arms pointing to screen -->
    <path d="M30 -38 Q50 -24 44 0 L30 -2 Q36 -18 24 -26 Z" fill="#1e3a8a"/>
    <path d="M-30 -38 Q-50 -24 -44 0 L-30 -2 Q-36 -18 -24 -26 Z" fill="#1e3a8a"/>
  </g>

  <!-- ==== Developer 3 (right, sitting, large monitor with code) ==== -->
  <g transform="translate(1240, 430)">
    <!-- Desk -->
    <rect x="-140" y="60" width="280" height="14" rx="4" fill="#ffffff" stroke="#dbe7ff" stroke-width="2"/>
    <rect x="-120" y="74" width="8" height="70" fill="#cbd5e1"/>
    <rect x="112" y="74" width="8" height="70" fill="#cbd5e1"/>
    <!-- Large monitor -->
    <rect x="-72" y="-50" width="144" height="92" rx="6" fill="url(#screen)" stroke="#1e3a8a" stroke-width="3"/>
    <rect x="-62" y="-42" width="124" height="76" rx="3" fill="#0f172a"/>
    <!-- Code -->
    <g stroke="#7dd3fc" stroke-width="4" stroke-linecap="round">
      <line x1="-52" y1="-30" x2="-24" y2="-30"/>
      <line x1="-52" y1="-20" x2="-8" y2="-20"/>
      <line x1="-52" y1="-10" x2="-34" y2="-10"/>
    </g>
    <g stroke="#f0abfc" stroke-width="4" stroke-linecap="round">
      <line x1="4" y1="-30" x2="40" y2="-30"/>
      <line x1="4" y1="-10" x2="28" y2="-10"/>
    </g>
    <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round">
      <line x1="-52" y1="0" x2="-16" y2="0"/>
      <line x1="-52" y1="10" x2="-30" y2="10"/>
      <line x1="4" y1="0" x2="36" y2="0"/>
      <line x1="4" y1="10" x2="20" y2="10"/>
    </g>
    <g stroke="#a5b4fc" stroke-width="4" stroke-linecap="round">
      <line x1="-52" y1="20" x2="-20" y2="20"/>
      <line x1="4" y1="20" x2="44" y2="20"/>
    </g>
    <rect x="-8" y="42" width="16" height="9" rx="2" fill="#1e3a8a"/>
    <!-- Head -->
    <circle cx="0" cy="-100" r="26" fill="#f1c27d"/>
    <g fill="#0f172a">
      <ellipse cx="-12" cy="-108" rx="10" ry="7"/>
      <ellipse cx="12" cy="-108" rx="10" ry="7"/>
    </g>
    <!-- Body -->
    <path d="M-42 -58 Q-42 -20 -26 -20 H26 Q42 -20 42 -58 Z" fill="#2563eb"/>
    <!-- Arms -->
    <path d="M30 -42 Q50 -30 44 -8 L30 -10 Q38 -24 24 -30 Z" fill="#1d4ed8"/>
    <path d="M-30 -42 Q-50 -30 -44 -8 L-30 -10 Q-38 -24 -24 -30 Z" fill="#1d4ed8"/>
  </g>

  <!-- ==== Floating chart / UI cards (futuristic accents) ==== -->
  <g filter="url(#soft)">
    <circle cx="1090" cy="180" r="60" fill="#bfdbfe" opacity="0.4"/>
  </g>
  <g transform="translate(1030, 150)">
    <rect x="0" y="0" width="120" height="70" rx="10" fill="url(#glass)" stroke="#ffffff" stroke-width="2"/>
    <rect x="14" y="14" width="40" height="8" rx="4" fill="#2563eb" opacity="0.6"/>
    <rect x="14" y="30" width="30" height="8" rx="4" fill="#93c5fd" opacity="0.6"/>
    <rect x="14" y="46" width="52" height="8" rx="4" fill="#bfdbfe" opacity="0.6"/>
    <circle cx="96" cy="22" r="6" fill="#3b82f6"/>
  </g>

  <!-- Spark / highlight element -->
  <g transform="translate(560, 200)">
    <path d="M0 0 L8 14 L0 12 L-8 14 Z" fill="#3b82f6" opacity="0.8"/>
  </g>

  <!-- Floating code window (right top) -->
  <g transform="translate(1330, 220)">
    <rect x="0" y="0" width="150" height="96" rx="10" fill="url(#glass)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="18" cy="16" r="5" fill="#3b82f6"/>
    <circle cx="34" cy="16" r="5" fill="#93c5fd"/>
    <circle cx="50" cy="16" r="5" fill="#bfdbfe"/>
    <g stroke="#1e3a8a" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <line x1="16" y1="38" x2="70" y2="38"/>
      <line x1="16" y1="52" x2="52" y2="52"/>
      <line x1="16" y1="66" x2="96" y2="66"/>
      <line x1="16" y1="80" x2="60" y2="80"/>
    </g>
  </g>

  <!-- Vignette overlay for depth -->
  <rect width="1600" height="900" fill="url(#bg)" opacity="0"/>
</svg>
